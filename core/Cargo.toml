[package]
name = "gyro-doctor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Repairs the gyro data track of a DJI O4 video"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bincode = "1.3"
mp4-merge = "0.2.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
